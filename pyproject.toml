[project]
name = "music-viz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "glfw>=2.11.0",
    "moderngl>=5.13.0",
    "moderngl-window>=3.1.1",
    "numpy",
    "sounddevice",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[dependency-groups]
dev = [
    "pybind11>=3.0.4",
]
